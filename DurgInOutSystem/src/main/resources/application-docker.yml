server:
  port: ${SERVER_PORT:9876}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000
      connection-test-query: SELECT 1

jwt:
  secret: ${JWT_SECRET}

backup:
  directory: ${BACKUP_DIR:/backups}

logging:
  level:
    com.gcky.durginoutsystem.mapper: info
