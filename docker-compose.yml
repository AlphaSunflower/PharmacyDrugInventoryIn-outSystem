services:
  mysql:
    image: mysql:8.0
    container_name: pharmacy-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: pharmacy_db
      MYSQL_USER: ${MYSQL_USER:-pharmacy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - pharmacy-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: pharmacy-backend:latest
    container_name: pharmacy-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 9876
      DB_URL: jdbc:mysql://mysql:3306/pharmacy_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-pharmacy}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-15}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-3}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -XX:+UseG1GC}
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    volumes:
      - ./backups:/backups:ro
    networks:
      - pharmacy-net

  mysql-backup:
    image: mysql:8.0
    container_name: pharmacy-mysql-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_DATABASE: pharmacy_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - ./backups:/backups
      - ./docker/mysql/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]
    networks:
      - pharmacy-net

volumes:
  mysql_data:

networks:
  pharmacy-net:
    driver: bridge
